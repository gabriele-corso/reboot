name: Publish stable

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: stable-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update flake.lock
        run: nix flake update

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish stable branch
        run: |
          git add flake.lock
          if git diff --cached --quiet; then
            echo "flake.lock già aggiornato"
          else
            git commit -m "chore(stable): update flake.lock"
          fi
          git checkout -B stable
          git push origin stable

      - name: Notify repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rev="$(git rev-parse HEAD)"
          jq -n --arg rev "$rev" \
            '{event_type:"stable-updated",client_payload:{rev:$rev,branch:"stable"}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -
