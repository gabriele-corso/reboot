name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate flake
        run: nix flake check --no-build --show-trace

      - name: Show kernel version
        run: |
          nix eval --raw \
            .#nixosConfigurations.reboot-iso.config.boot.kernelPackages.kernel.version
